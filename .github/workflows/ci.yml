name: Verify Studyspace
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  vercel-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test web/build.test.mjs
      - run: node --check web/app.js
      - run: node web/build.mjs
        env:
          STUDYSPACE_BACKEND_URL: https://backend.example.com
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_publish.py
      - run: python -m unittest discover -s tests -v
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - name: Validate authenticated gateway configuration
        run: |
          export STUDYSPACE_BACKEND_DOMAIN=backend.example.com
          export STUDYSPACE_FRONTEND_ORIGIN=https://studyspace.vercel.app
          export STUDYSPACE_LOGIN=ci-fixture
          export STUDYSPACE_PASSWORD_HASH="$(docker run --rm caddy:2-alpine caddy hash-password --plaintext ci-fixture-only)"
          docker compose -f compose.yaml -f compose.gateway.yaml config --quiet
          docker run --rm -e STUDYSPACE_BACKEND_DOMAIN -e STUDYSPACE_FRONTEND_ORIGIN -e STUDYSPACE_LOGIN -e STUDYSPACE_PASSWORD_HASH -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - run: docker compose build
      - name: Smoke test container startup
        run: |
          docker compose up -d
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - if: always()
        run: docker compose down
