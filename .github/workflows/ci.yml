name: Verify Studyspace
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_publish.py
      - run: python -m unittest discover -s tests -v
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
      - name: Smoke test container startup
        run: |
          docker compose up -d
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - if: always()
        run: docker compose down
