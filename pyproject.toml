[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "muj-study-assistant"
version = "0.1.0"
description = "Local LMS notes, Gemini study aids, and YouTube recommendations"
requires-python = ">=3.11"
dependencies = ["google-genai>=1.0,<3", "pydantic>=2,<3", "httpx>=0.27,<1", "playwright>=1.48,<2", "pypdf>=5,<7", "python-docx>=1.1,<2", "python-pptx>=1,<2", "streamlit>=1.66,<2", "tzdata>=2024.1"]

[project.scripts]
muj-study = "muj_study.cli:main"

[tool.setuptools.packages.find]
include = ["muj_study*"]
